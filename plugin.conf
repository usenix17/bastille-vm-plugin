# Bastille plugin manifest (sysrc-style key=value).
#
# Format merged in BastilleBSD/bastille#1600. Bastille reads this at install to
# name the plugin, check compatibility, and satisfy host prerequisites. Harmless
# on older Bastille versions that don't read it.
#
#   name           plugin dir and the word after `plugin` (bastille plugin vm ...)
#   min_version    minimum Bastille version required
#   depends_kmods  kernel modules to load (jails can't autoload them)
#   depends_pkgs    host packages required (qemu-tools only needed for qcow2)

name="vm"
min_version="1.4.4"
depends_kmods="vmm nmdm"
depends_pkgs="edk2-bhyve qemu-tools"
