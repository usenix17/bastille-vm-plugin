# Bastille plugin manifest (sysrc-style key=value).
#
# Proposed format under discussion in BastilleBSD/bastille#1600. When Bastille
# supports it, it reads this before/at install to name the plugin, check
# compatibility, and satisfy host prerequisites. Harmless on Bastille versions
# that don't yet read it.
#
#   name           install directory and the word after `-p` (bastille -p vm ...)
#   min_version    minimum Bastille version required
#   depends_kmods  kernel modules to load (jails can't autoload them)
#   depends_pkgs    host packages required (qemu-tools only needed for qcow2)

name="vm"
min_version="1.5.0"
depends_kmods="vmm nmdm"
depends_pkgs="edk2-bhyve qemu-tools"
